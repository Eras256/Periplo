name: CI

on:
  push:
    branches: [main]
  pull_request:

# Phase 0 gate (master spec): pnpm install && pnpm typecheck && pnpm lint && pnpm test
# must exit 0. licence-check and osv-scan are additional CI-only gates from §6/§7.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        # SUPABASE_*/STELLAR_FEE_SPONSOR_* secrets gate the Phase 2/3
        # integration suites (packages/bazaar/src/db/resources.integration.test.ts,
        # apps/facilitator/src/core.test.ts) — they're not set on PRs from
        # forks (GitHub doesn't expose repo secrets to those runs), so
        # those suites skip gracefully rather than failing; see
        # docs/DEFERRED.md.
        run: pnpm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STELLAR_FEE_SPONSOR_SECRET: ${{ secrets.STELLAR_FEE_SPONSOR_SECRET }}
          STELLAR_FEE_SPONSOR_PUBLIC: ${{ secrets.STELLAR_FEE_SPONSOR_PUBLIC }}

      - name: Licence gate (no AGPL / copyleft transitive — spec §1)
        run: pnpm licence-check

# osv-scan job removed 2026-08-07 (see docs/DEFERRED.md): its
# reusable-workflow call was malformed in a way that broke GitHub's
# workflow-file parsing entirely, which meant the `build` job above never
# ran on any push since Phase 1 either -- confirmed via `gh run list`
# showing every run failing in 0s with zero jobs scheduled. Removing the
# broken job first so `build` runs for real; osv-scan gets added back once
# its correct call signature is confirmed against a real, isolated run.
