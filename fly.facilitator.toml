# Fly.io config for apps/facilitator, testnet deployment (spec §8).
# Deploy from the repo root:
#   fly deploy --config fly.facilitator.toml --dockerfile Dockerfile.facilitator
#
# Only stellar:testnet is configured (STELLAR_FEE_SPONSOR_SECRET fly secret),
# periplo-mainnet is a separate app, deferred until a mainnet fee-sponsor
# key exists (docs/DEFERRED.md). Never both networks on one app: keeps the
# blast radius of a testnet-key compromise from ever touching mainnet.

app = "periplo-testnet"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8402
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1 # never 0, cold start breaks agent latency SLOs (spec §8)
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks.health]
  type = "http"
  path = "/health"
  interval = "15s"
  timeout = "2s"
